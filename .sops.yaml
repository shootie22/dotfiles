creation_rules:
  - path_regex: secrets/fuji\.yaml$
    age: age1qwuleu9k2gzgex43tyhhy80vgg9kym5dcdne32x4f0lw4xzsxy3spau58l

  - path_regex: secrets/mixi\.yaml$
    age: age1kq4c5jnjyv4d5vhtm8hvntwg0l2jcv640wvfaexgwz5ctwh9dg4qn9d2rp

  - path_regex: secrets/thinkcentre\.yaml$
    age: age1yvhkx6094utagx3xdfzyq08pwkatyj8lyrpt7jpufq70v8yer9csv66dfc

  # For the thinkcentre's NixOS install (infrastructure #18): the 4 TB disk's
  # keyfile (binary) and the k3s agent token. Personal key too, so they can
  # be recovered and checked from nixpad.
  - path_regex: secrets/thinkcentre-(storage-key\.bin|k3s\.yaml)$
    age: age1yvhkx6094utagx3xdfzyq08pwkatyj8lyrpt7jpufq70v8yer9csv66dfc,age1a4pmutcnee2nflw6t70lt4cq3u08sp5d60andp5hm7wmu9hwsp6qlcp659

  - path_regex: secrets/minima\.yaml$
    age: age14y8ufs6pmctu6rcyz6kmm63m6a0ctga24s7zxkcf38akj7tvzyxqy564tk

  # edge: its age identity is derived from its SSH host key (ssh-to-age), so
  # the host key is the only thing to keep. The personal key can always
  # decrypt, from nixpad or the workstation.
  - path_regex: secrets/edge\.yaml$
    age: age1zmj70ksy0te2fy3qkfq20ednn6cha62eas0e8cc2qtjp4x6lk9ns046l8q,age1a4pmutcnee2nflw6t70lt4cq3u08sp5d60andp5hm7wmu9hwsp6qlcp659

  # Tokens for the failover checkers on the edge and mixi
  # (modules/nixos/failover-checker). Personal key so it can be edited here.
  - path_regex: secrets/failover\.yaml$
    age: age1zmj70ksy0te2fy3qkfq20ednn6cha62eas0e8cc2qtjp4x6lk9ns046l8q,age1kq4c5jnjyv4d5vhtm8hvntwg0l2jcv640wvfaexgwz5ctwh9dg4qn9d2rp,age1a4pmutcnee2nflw6t70lt4cq3u08sp5d60andp5hm7wmu9hwsp6qlcp659

  # Deploy key fuji uses to push the weekly update branch
  # (modules/nixos/weekly-update.nix). fuji plus the personal key.
  - path_regex: secrets/weekly-update\.yaml$
    age: age1qwuleu9k2gzgex43tyhhy80vgg9kym5dcdne32x4f0lw4xzsxy3spau58l,age1a4pmutcnee2nflw6t70lt4cq3u08sp5d60andp5hm7wmu9hwsp6qlcp659

  # The edge's SSH host key itself, for reinstalls (scripts/edge-install).
  # Personal key only: the edge never needs to read this file.
  - path_regex: secrets/edge-bootstrap\.yaml$
    age: age1a4pmutcnee2nflw6t70lt4cq3u08sp5d60andp5hm7wmu9hwsp6qlcp659
