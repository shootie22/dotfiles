##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Basics/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Basics/Workspace-Rules/ for workspace rules

# Hyprland 0.55 reworked window rule syntax: every term is now a `name value`
# pair rather than `name:value`, effect names are snake_case (suppressevent ->
# suppress_event, nofocus -> no_focus), and match conditions are prefixed with
# `match:`. Some match properties were renamed too: floating -> float,
# pinned -> pin. Booleans are true/false instead of 1/0.

# Example windowrule
# windowrule = float true, match:class ^(kitty)$, match:title ^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus true, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false
